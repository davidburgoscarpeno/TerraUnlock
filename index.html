    <script>window.__CF_BEACON_TOKEN = 'PENDIENTE_SITE_TAG';</script>
    <script type="module" crossorigin src="/TerraUnlock/assets/index-Ra9VMTo5.js"></script>
    <link rel="stylesheet" crossorigin href="/TerraUnlock/assets/index-xaj5GAfW.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Cloudflare Web Analytics (beacon). Con el placeholder no carga nada:
      // hasta que window.__CF_BEACON_TOKEN tenga el siteTag real, esto es un no-op.
      (function () {
        var tok = window.__CF_BEACON_TOKEN;
        if (!tok || tok === 'PENDIENTE_SITE_TAG') return;
        var sc = document.createElement('script');
        sc.defer = true;
        sc.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        sc.setAttribute('data-cf-beacon', JSON.stringify({ token: tok }));
        document.head.appendChild(sc);
      })();
    </script>
  </body>
